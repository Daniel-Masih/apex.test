<!DOCTYPE html>
<html>
<head>
  <title>Oracle API Test</title>
</head>

<body>
  <h1>Oracle API Test</h1>

  <h2>Write Data</h2>

  <input id="message" type="text" placeholder="Enter a message">
  <button onclick="saveData()">Save to Oracle</button>

  <p id="saveResult"></p>

  <hr>

  <h2>Read Data</h2>

  <button onclick="getData()">Get Data from Oracle</button>

  <pre id="result">Waiting...</pre>

  <script>
    const apiUrl =
      "https://cokapxt01a.kitchener.ca/apex/testwo/webapp-test/hello";

    async function saveData() {
      const message = document.getElementById("message").value;
      const result = document.getElementById("saveResult");

      try {
        result.textContent = "Saving...";

        const response = await fetch(apiUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        result.textContent = "Saved to Oracle!";
      } catch (error) {
        result.textContent = "ERROR: " + error;
      }
    }

    async function getData() {
      const result = document.getElementById("result");

      try {
        result.textContent = "Loading...";

        const response = await fetch(apiUrl);

        const data = await response.json();

        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent = "ERROR: " + error;
      }
    }
  </script>

</body>
</html>
